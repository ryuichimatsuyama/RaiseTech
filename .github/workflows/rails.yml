name: rails

on: [push]

jobs:
  setup:
    name: setup aws using cloudFormation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup aws
        uses: ./.github/actions/create-resources
        with:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          MasterUserPassword: ${{ vars.MasterUserPassword }}
          stackName: ${{ vars.stackName }}
  configure:
    name: configure ec2 using ansible
    runs-on: ubuntu-latest
    needs: setup
    container: python:3.8
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install AWS CLI
        run: |
          apt-get update
          apt-get install -y awscli
      - name: update SG of EC2
        uses: ./.github/actions/update-security group EC2
        with:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      - name: get output of aws
        uses: ./.github/actions/get-output-aws
        with:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          stackName: ${{ vars.stackName }}
      - name: Add vars to Ansible inventory
        env: 
          MasterUserPassword: ${{ vars.MasterUserPassword }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          echo "all:" > inventory.yml
          echo "  hosts:" >> inventory.yml
          echo "    appserver:" >> inventory.yml
          echo "      ansible_host: $PublicIpAddress" >> inventory.yml
          echo "      ansible_user: ec2-user" >> inventory.yml
          echo "      ansible_ssh_private_key_file: ~/.ssh/id_rsa" >> inventory.yml
          echo "      region: $AWS_DEFAULT_REGION" >> inventory.yml
          echo "      ALBEndpoint: $ALBEndpoint" >> inventory.yml
          echo "      BucketName: $BucketName" >> inventory.yml
          echo "      RDSEndpoint: $RDSEndpoint" >> inventory.yml
          echo "      MasterUserPassword: $MasterUserPassword" >> inventory.yml
      - name: Install Ansible   
        run: |
          apt-get update
          apt-get install -y python3-pip
          pip3 install ansible 
      - name: Setup SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      # - name: Create ansible.cfg
      #   run: |
      #     echo '[defaults]' > ansible.cfg
      #     echo 'host_key_checking = False' >> ansible.cfg 
      - name: Install Middleware using Ansible
        run: |
          ansible-playbook -i inventory.yml ansible/rails_playbook.yaml
  test:
    name: test ec2 using serverspec
    runs-on: ubuntu-latest
    needs: configure
    container: ruby:3.0.2
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install AWS CLI
        run: |
          apt-get update
          apt-get install -y awscli  
      - name: update SG of EC2
        uses: ./.github/actions/update-security group EC2
        with:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      - name: get output of aws
        uses: ./.github/actions/get-output-aws
        with:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          stackName: ${{ vars.stackName }}
      - name: Setup SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - name: Create SSH config file
        run: |
          echo "Host target" >> ~/.ssh/config
          echo "    Hostname $PublicIpAddress" >> ~/.ssh/config
          echo "    User ec2-user" >> ~/.ssh/config
          echo "    IdentityFile ~/.ssh/id_rsa" >> ~/.ssh/config
          chmod 600 ~/.ssh/config    
      - name: Install bundler
        run: |
          apt-get update
          gem install bundler
          bundle config set path 'serverspec/vendor/bundle'
          cd serverspec
          bundle install
      - name: Run ServerSpec tests
        run: |
          cd serverspec
          bundle exec rake spec
    
      
     
         
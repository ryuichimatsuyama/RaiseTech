name: 'update security group EC2 of aws'

description: 'update security group EC2 of aws using cloudFormation'

inputs:
  AWS_ACCESS_KEY_ID:
    required: true
  AWS_SECRET_ACCESS_KEY:
    required: true
  AWS_DEFAULT_REGION:
    required: true

runs:
  using: 'composite'
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ inputs.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ inputs.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ inputs.AWS_DEFAULT_REGION }}
    - name: update security group EC2 of aws
      shell: bash
      run: |
        MY_IP=$(curl -s http://checkip.amazonaws.com)
        aws cloudformation update-stack --stack-name SecurityGroup --template-body file://cloudformation/SecurityGroup.yml --parameters ParameterKey=MyIP,ParameterValue=$MY_IP/32
